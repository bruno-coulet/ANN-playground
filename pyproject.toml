[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ann-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "ipykernel>=6.29.0",
    "keras>=3.0.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "streamlit>=1.31.0",
    "tensorflow-cpu>=2.16.0",
    "torch>=2.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

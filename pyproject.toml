[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ann-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "ipykernel>=6.29.0",
    "keras>=3.0.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "streamlit>=1.31.0",
    "tensorflow-cpu>=2.16.0",
    "torch>=2.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/*_old.py",
    "notebooks"
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B"
]

ignore = [
    "E501"
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

[tool.coverage.run]
omit = [
    "src/ann_playground/cleaning_utils_old.py",
]

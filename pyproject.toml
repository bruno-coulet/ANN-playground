[project]
name = "ann-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philippe Laurens", email = "philippe.laurens@laplateforme.io" }
]
requires-python = ">=3.13"
dependencies = [
    "chardet>=7.6.0",
    "ipykernel>=6.29.0",
    "keras>=3.0.0",
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyprojroot>=0.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
    "tensorflow>=2.21.0",
    "torch>=2.14.1",
    "ucimlrepo>=0.0.7",
    "mlflow[auth]>=3.18.0",
]

[project.scripts]
ann-playground = "ann_playground:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

version: "3.8"

services:
  mlflow:
    build: .
    container_name: ann_mlflow_server
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlartifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    ports:
      - "5000:5000"
    restart: unless-stopped

  streamlit:
    build: .
    container_name: ann_streamlit_app
    command: >
      streamlit run src/ann_playground/apps/app.py
      --server.port=8501
      --server.address=0.0.0.0
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    ports:
      - "8501:8501"
    depends_on:
      - mlflow
    restart: unless-stopped

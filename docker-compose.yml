# ==============================================================================
# File : docker-compose.yml
# Description : Multi-container orchestration for ANN Playground.
#               Manages MLflow tracking server and Streamlit interactive UI.
# ==============================================================================

# Note on MLflow Tracking Server Access (--allowed-hosts):
# mlflow:5000 : Requêtes envoyées par le conteneur streamlit via le réseau bridge interne de Docker
# localhost:5000 : Accès à l'interface web MLflow depuis le navigateur de l'hôte
# 127.0.0.1:5000 : Appels API locaux éventuels depuis le terminal WSL2 ou macOS.
services:
  mlflow:
    build: .
    image: ann-playground:latest
    container_name: ann_mlflow_server
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=localhost:5000,127.0.0.1:5000,mlflow:5000
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlartifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    ports:
      - "5000:5000"
    restart: unless-stopped

  streamlit:
    image: ann-playground:latest
    container_name: ann_streamlit_app
    command: >
      streamlit run src/ann_playground/apps/app.py
      --server.port=8501
      --server.address=0.0.0.0
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./mlartifacts:/app/mlartifacts
    ports:
      - "8501:8501"
    depends_on:
      - mlflow
    restart: unless-stopped
